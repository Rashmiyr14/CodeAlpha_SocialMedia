<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Social Media</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>CodeAlpha Social Media</h1>
        <button id="logoutBtn" onclick="logout()" style="display:none;">
            Logout
        </button>
    </header>

    <main>

        <!-- Authentication Section -->
        <section id="authSection">

            <div class="auth-box">
                <h2>Register</h2>

                <input type="text" id="registerName" placeholder="Full Name">
                <input type="text" id="registerUsername" placeholder="Username">
                <input type="password" id="registerPassword" placeholder="Password">

                <button onclick="register()">Register</button>

                <p id="registerMessage"></p>
            </div>


            <div class="auth-box">
                <h2>Login</h2>

                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">

                <button onclick="login()">Login</button>

                <p id="loginMessage"></p>
            </div>

        </section>


        <!-- Social Media Section -->
        <section id="socialSection" style="display:none;">

            <!-- Profile -->
            <div class="profile-box">
                <h2>My Profile</h2>

                <p>
                    <strong>Name:</strong>
                    <span id="profileName"></span>
                </p>

                <p>
                    <strong>Username:</strong>
                    <span id="profileUsername"></span>
                </p>

                <p>
                    <strong>Bio:</strong>
                    <span id="profileBio"></span>
                </p>

                <p>
                    <strong>Posts:</strong>
                    <span id="profilePosts"></span>
                    &nbsp;&nbsp;

                    <strong>Followers:</strong>
                    <span id="profileFollowers"></span>
                    &nbsp;&nbsp;

                    <strong>Following:</strong>
                    <span id="profileFollowing"></span>
                </p>
            </div>


            <!-- Create Post -->
            <div class="post-box">
                <h2>Create Post</h2>

                <textarea
                    id="postContent"
                    placeholder="What's on your mind?"
                ></textarea>

                <button onclick="createPost()">Post</button>

                <p id="postMessage"></p>
            </div>


            <!-- Feed -->
            <div class="feed-box">
                <h2>News Feed</h2>

                <div id="feed"></div>
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
